kicker: About the Producer
title: Agency-level output, delivered entirely solo
bio:
- Hi, I'm **John Lloyd Sarez**, founder and only producer of PlayPress Studio. I
  help founders and consultants turn every recorded episode into a full week of content,
  without them lifting a finger past the record button.
- 'My path in wasn''t the usual one. I graduated in Computer Engineering, and the
  pandemic hit before I''d ever set foot in a corporate office. My first break was
  writing podcast show-notes, back when that meant actually listening to every episode
  and writing it out by hand. One task led to the next: editing video, running socials,
  then leading a team of virtual assistants across a slate of client shows for over
  four years.'
- 'That time taught me the difference between content that''s finished and content
  that''s done right. When a show moves through many hands, an episode rarely gets
  one person''s full, honest attention. So I built PlayPress Studio to be the opposite:
  one producer, your show end-to-end, and a roster I keep small on purpose.'
