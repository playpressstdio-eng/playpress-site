# FAQ
kicker: "Questions"
title: "Frequently asked questions"
items:
  - q: "How much does podcast editing cost?"
    a: "Plans start at $459/month for full episode production and go up to $1,379/month for complete production plus weekly social repurposing. Founding rates lock in for the first three months."
  - q: "What do you need from me each week?"
    a: "Just your raw audio or video files, your guest's name and bio, and any links you referenced. I handle the entire production pipeline after recording."
  - q: "How fast is the turnaround?"
    a: "Standard delivery is 48 to 72 hours from receiving complete raw files."
  - q: "How do revisions work?"
    a: "Every episode includes up to two rounds of minor revisions requested within 5 business days of delivery."
  - q: "Is there a long-term contract?"
    a: "No. Plans are billed monthly with a simple 14-day written notice if you ever need to pause or cancel."
