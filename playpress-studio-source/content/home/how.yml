# How It Works
kicker: "The Process"
title: "Simple, predictable, zero back-and-forth"
subtitle: "A streamlined workflow designed so podcast production never takes you away from running your business."
steps:
  - badge: "Step 01"
    title: "Drop the raw file"
    text: "Upload your audio or video recording and guest info to your dedicated folder. Your production work ends there."
  - badge: "Step 02"
    title: "Production & QC"
    text: "I master the audio (-16 LUFS), cut dead air, pull vertical reels, draft the copy, and review every file before you see it."
  - badge: "Step 03"
    title: "Approved & published"
    text: "Once you give the green light, I schedule the episode to your podcast host and YouTube, then roll out clips all week."
