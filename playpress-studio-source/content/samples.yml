# Before / After videos
compare:
  headline: "Full-Episode Dialogue Cleanup"
  label: "Audio & Video Mastering"
  before_label: "BEFORE: RAW"
  before_video: "https://www.youtube.com/embed/x-m5vAnLH80"
  before_caption: "**Raw video** directly recorded from a camera, audio from the camera mic. No software filter pass, no dedicated recording microphone. Everything is as raw as it can be."
